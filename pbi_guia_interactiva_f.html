<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power BI Desktop – Guía Interactiva</title>
<!-- Importar la fuente Montserrat desde Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Variables por defecto (Modo Oscuro) */
:root {
  --color-fondo-panel: #0f1824;
  --color-fondo-tarjeta: #151e2b; /* <-- NUEVA: Fondo oscuro intermedio para la tarjeta */
  --color-texto-desc: #a0b8cc;
}

/* Detector de Modo Claro en el navegador */
@media (prefers-color-scheme: light) {
  :root {
    --color-fondo-panel: #ffffff; 
    --color-fondo-tarjeta: #f4f6f9; /* <-- NUEVA: Fondo gris muy claro para la tarjeta */
    --color-texto-desc: #1a2a3a;  /* Texto oscuro con alto contraste */
  }
}

body {
  background: var(--color-fondo-body);
  font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; /* <-- CAMBIADO */
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
header{width:100%;max-width:1280px;padding:14px 20px 6px;text-align:center}
header h1{font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.03em}
header p{font-size:.75rem;color:#5a7a94;margin-top:3px}
.hint{font-size:.72rem;color:#3a607a;margin:5px 0 12px;text-align:center}
.hint span{border:1px solid #1e3a52;border-radius:20px;padding:3px 14px;display:inline-block}
.image-wrapper{position:relative;width:100%;max-width:1280px;margin:0 auto}
.image-wrapper img{width:100%;height:auto;display:block;border:1px solid #1a2e40;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
.hotspot{position:absolute;border-radius:50%;cursor:pointer;background:transparent;border:2px solid transparent;transform:translate(-50%,-50%);width:3.7%;aspect-ratio:1;transition:box-shadow .18s ease,border-color .18s ease,background .18s ease}
.hotspot:hover{box-shadow:0 0 0 5px rgba(30,145,200,.38);border-color:rgba(30,145,200,.7);background:rgba(30,145,200,.1)}
.hotspot.active{box-shadow:0 0 0 6px rgba(0,180,230,.5);border-color:rgba(0,200,245,.9);background:rgba(30,145,200,.15)}
.info-panel{position:fixed;top:0;right:-440px;width:400px;max-width:92vw;height:100vh;background:var(--color-fondo-panel);border-left:2px solid #1a5e8a;display:flex;flex-direction:column;transition:right .3s cubic-bezier(.4,0,.2,1);z-index:1000;overflow:hidden}
.info-panel.open{right:0}
.panel-header{background:#0f1824;padding:14px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #1e3448;flex-shrink:0}
.pnum{width:34px;height:34px;border-radius:50%;border:2.5px solid #1e8fc8;color:#1e8fc8;font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ptitle{font-size:.9rem;font-weight:700;color:#fff;line-height:1.3}
.psub{font-size:.67rem;color:#5a9fbe;margin-top:2px}
.close-btn{background:none;border:none;color:#4a7a98;cursor:pointer;margin-left:auto;font-size:1rem;padding:4px 7px;border-radius:4px;transition:color .15s,background .15s;flex-shrink:0}
.close-btn:hover{color:#fff;background:#1e3448}
.panel-body {
  flex: 1;
  height: calc(100vh - 70px); /* Resta el espacio aproximado del encabezado del panel */
  overflow-y: auto;           /* Activa el scroll vertical si el contenido supera el alto */
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
/* Hacer la barra de scroll más visible y responsiva al tema del navegador */
.panel-body::-webkit-scrollbar {
  width: 8px; /* Aumentado de 3px a 8px para que se note */
}
.panel-body::-webkit-scrollbar-track {
  background: #0f1824; /* Fondo del carril del scroll */
}
.panel-body::-webkit-scrollbar-thumb {
  background: #1e8fc8; /* Color azul celeste brillante para que resalte */
  border-radius: 4px;
}
.panel-body::-webkit-scrollbar-thumb:hover {
  background: #00b4e6; /* Brillo extra cuando el usuario pasa el mouse */
}
.tags{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0 2px}
.tag{background:#102030;color:#5a9fc8;font-size:.63rem;font-weight:600;padding:2px 8px;border-radius:3px;border:1px solid #1e3a52;letter-spacing:.04em}
.card {
  background: var(--color-fondo-tarjeta); /* <-- CAMBIADO: Usa la variable específica de la tarjeta */
  border:1px solid #1c2e42;
  border-radius:8px;
  padding:13px 15px;
}
.card h3{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1e8fc8;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.card p {
  font-size:.77rem;
  line-height:1.62;
  color: var(--color-texto-desc); /* Cambiará según el modo */
}
.card ul{margin-top:6px;padding-left:14px;display:flex;flex-direction:column;gap:5px}
.card ul li{font-size:.76rem;line-height:1.55;color: var(--color-texto-desc)}
.card ul li b{color:#c8dde8}
.tip{background:#0d1e12;border:1px solid #1e3c22;border-radius:7px;padding:11px 13px}
.tip strong{color:#4aaa5a;display:block;margin-bottom:4px;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}
.tip p{font-size:.75rem;line-height:1.57;color:#7acc8a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin-top:6px}
.kv dt{font-size:.68rem;color:#1e8fc8;font-weight:700;padding-top:1px;white-space:nowrap}
.kv dd{font-size:.75rem;color:#a0b8cc;line-height:1.5}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999}
.overlay.active{display:block}
.icon-c{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#0d2035;border-radius:50%;font-size:.72rem;flex-shrink:0}
</style>
</head>

const DATA = {
  1:{
    title:"Cinta de opciones (Ribbon)",
    sub:"Barra de navegación principal",
    tags:["Ribbon","UI Shell","Pestañas","Menú"],
    desc:`La <b>cinta de opciones</b> es la barra de comandos principal de Power BI Desktop, inspirada en el diseño Fluent de Microsoft Office. Organiza todas las acciones disponibles en seis pestañas temáticas que agrupan herramientas afines.<br><br>
Cada pestaña contiene <b>grupos</b> que reúnen los botones relacionados:
<ul>
  <li><b>Inicio:</b> Datos, Consultas, Insertar, Cálculos y Compartir.</li>
  <li><b>Insertar:</b> Nuevos objetos visuales, cuadros de texto, formas, imágenes y botones de navegación.</li>
  <li><b>Modelado:</b> Gestión de relaciones, cálculo de tablas y columnas DAX, seguridad a nivel de fila (RLS).</li>
  <li><b>Ver:</b> Opciones de pantalla, temas, cuadrícula, sincronización de segmentadores entre páginas.</li>
  <li><b>Optimizar:</b> Analizador de rendimiento (Performance Analyzer) para identificar visuales lentos.</li>
  <li><b>Ayuda:</b> Acceso a documentación, comunidad, guías de aprendizaje y soporte.</li>
</ul>`,
    uso:`<dl class="kv">
  <dt>Acceso rápido</dt><dd>Presiona <code>Alt</code> para revelar las teclas de acceso rápido de cada botón sin usar el ratón.</dd>
  <dt>Anclar comandos</dt><dd>Haz clic derecho sobre cualquier botón para añadirlo a la <em>Barra de herramientas de acceso rápido</em> (QAT) en la esquina superior izquierda.</dd>
  <dt>Contraer cinta</dt><dd>Doble clic sobre una pestaña colapsa la cinta para ganar espacio vertical en pantallas pequeñas.</dd>
  <dt>Modo táctil</dt><dd>En Ver → Diseño de dispositivos móviles puedes cambiar a una cinta simplificada para pantallas táctiles.</dd>
</dl>`,
    tip:"Usa <code>Ctrl + 1</code>, <code>Ctrl + 2</code> y <code>Ctrl + 3</code> para saltar entre Vista de Informe, Vista de Tabla y Vista de Modelo sin tocar la barra lateral."
  },
  2:{
    title:"Vista de Informe",
    sub:"Barra de vistas lateral izquierda",
    tags:["Report View","Lienzo","Diseño","Páginas","Dashboard"],
    desc:`La <b>Vista de Informe</b> es el espacio de diseño principal de Power BI Desktop. Se activa con el ícono de gráfico de barras en la barra lateral y es la vista predeterminada al abrir un archivo <code>.pbix</code>.<br><br>
Está formada por tres zonas que trabajan en conjunto:
<ul>
  <li><b>El lienzo central</b> donde se colocan y configuran los objetos visuales.</li>
  <li><b>El panel de Filtros</b> (izquierda de los paneles laterales) para condicionantes de datos.</li>
  <li><b>Los paneles de Visualizaciones y Datos</b> (derecha) para construir los visuales.</li>
</ul>
Soporta múltiples <b>páginas</b> (pestañas en la barra inferior), cada una con su propio lienzo, filtros y visuales independientes. Las páginas pueden ser visibles u ocultarse para el usuario final.`,
    uso:`<dl class="kv">
  <dt>Crear un visual</dt><dd>Selecciona un tipo de gráfico en el panel Visualizaciones <em>antes</em> de arrastrar campos, o arrastra directamente un campo numérico al lienzo para que Power BI elija el tipo automáticamente.</dd>
  <dt>Gestionar páginas</dt><dd>Clic derecho sobre una pestaña de página para renombrarla, duplicarla, ocultarla o moverla de posición.</dd>
  <dt>Temas de color</dt><dd>En Ver → Temas puedes aplicar un JSON de colores corporativos a todo el informe con un solo clic.</dd>
  <dt>Imagen de fondo</dt><dd>En el panel Formato de página puedes insertar un PNG/SVG como fondo (ej. una plantilla en Figma) y construir encima con transparencia.</dd>
  <dt>Vista móvil</dt><dd>Ver → Diseño de dispositivos móviles reorganiza los visuales para pantallas verticales sin alterar la vista de escritorio.</dd>
</dl>`,
    tip:"Activa <b>Ver → Cuadrícula</b> y <b>Ajustar objetos a la cuadrícula</b> para que los visuales se alineen automáticamente al moverlos, evitando desalineaciones manuales."
  },
  3:{
    title:"Vista de Tabla (Datos)",
    sub:"Barra de vistas lateral izquierda",
    tags:["Table View","Data View","Columnas calculadas","Tipos de dato","Auditoría"],
    desc:`La <b>Vista de Tabla</b> (también llamada Vista de Datos) presenta los datos importados o calculados en formato tabular, exactamente como residen en el modelo semántico de Power BI, después de todas las transformaciones de Power Query.<br><br>
Permite explorar el contenido real de cada tabla del modelo:
<ul>
  <li>Ver todos los registros fila por fila y columna por columna.</li>
  <li>Detectar valores nulos, cadenas vacías, fechas mal formateadas o duplicados.</li>
  <li>Verificar que los tipos de datos sean correctos (Texto, Número entero, Decimal, Fecha, Booleano…).</li>
  <li>Comprobar el resultado de columnas calculadas con DAX en tiempo real.</li>
  <li>Confirmar la cardinalidad real de los datos antes de definir relaciones en el modelo.</li>
</ul>
La <b>barra de fórmulas</b> que aparece en la parte superior de esta vista permite escribir y editar expresiones DAX para crear nuevas columnas calculadas.`,
    uso:`<dl class="kv">
  <dt>Columna calculada</dt><dd>Selecciona la tabla en el panel Datos → clic en <em>Nueva columna</em> (pestaña Modelado) → escribe la fórmula DAX. La nueva columna se almacena en el modelo y consume memoria.</dd>
  <dt>Cambiar tipo</dt><dd>Clic derecho sobre el encabezado de columna → <em>Tipo de datos</em> para convertirla sin volver a Power Query.</dd>
  <dt>Ordenar columna</dt><dd>Clic en el encabezado para ordenar ascendente/descendente y explorar la distribución de valores.</dd>
  <dt>Buscar fila</dt><dd>Usa <code>Ctrl + F</code> para buscar un valor específico dentro de la tabla visible.</dd>
  <dt>Copiar datos</dt><dd>Selecciona celdas con <code>Shift + clic</code> y copia con <code>Ctrl + C</code> para pegarlas en Excel.</dd>
</dl>`,
    tip:"Las columnas calculadas en Vista de Tabla se evalúan fila por fila (contexto de fila DAX) y se materializan en memoria. Para cálculos agregados que no necesiten contexto de fila, usa <b>Medidas</b> en lugar de columnas; son más eficientes."
  },
  4:{
    title:"Vista de Modelo / DAX / TMDL",
    sub:"Barra de vistas lateral izquierda",
    tags:["Model View","Relaciones","DAX","TMDL","Cardinalidad","RLS"],
    desc:`La barra lateral agrupa tres accesos distintos que operan sobre el modelo semántico subyacente del archivo <code>.pbix</code>:<br><br>
<ul>
  <li><b>Vista de Modelo:</b> Diagrama entidad-relación interactivo. Muestra todas las tablas como tarjetas con sus columnas y las relaciones entre ellas representadas como líneas con indicadores de cardinalidad (<code>1</code> y <code>*</code>) y dirección de filtro (flecha simple o doble).</li>
  <li><b>Editor DAX (ícono DAX):</b> Abre una vista de consultas DAX donde puedes escribir y evaluar expresiones DAX directamente contra el modelo, útil para depurar medidas complejas.</li>
  <li><b>Editor TMDL (ícono TMDL):</b> Tabular Model Definition Language. Permite editar el modelo completo como código de texto plano estructurado, ideal para control de versiones en Git y despliegues automatizados.</li>
</ul>`,
    uso:`<dl class="kv">
  <dt>Crear relación</dt><dd>Arrastra una columna de una tabla sobre la columna equivalente de otra tabla. Power BI detecta automáticamente cardinalidad y dirección de filtro sugeridas.</dd>
  <dt>Editar relación</dt><dd>Doble clic sobre la línea de relación abre el diálogo para cambiar columnas, cardinalidad (<em>Uno-a-muchos, Muchos-a-muchos</em>) y dirección del filtro cruzado.</dd>
  <dt>Relación inactiva</dt><dd>Si hay más de una relación entre dos tablas, las adicionales aparecen como línea punteada (inactivas). Se activan en DAX con <code>USERELATIONSHIP()</code>.</dd>
  <dt>Seguridad RLS</dt><dd>En Modelado → Administrar roles se definen filtros DAX por rol (ej. un analista solo ve sus expedientes). Se prueba con <em>Ver como rol</em>.</dd>
      <dt>Organizar diagrama</dt><dd>Arrastra las tarjetas de tabla para reorganizar el diagrama visualmente. Usa Ctrl+A para seleccionar todas y Auto-diseño para distribuirlas automáticamente.</dd>
</dl>`,
    tip:"En la Vista de Modelo activa la opción <b>Diseño → Mostrar tablas ocultas</b> para ver las tablas marcadas como ocultas (ej. tablas auxiliares de calendario o puentes) y verificar que sus relaciones están bien configuradas."
  },
  5:{
    title:"Grupo Datos – Conectores",
    sub:"Sección de la cinta de opciones (Pestaña Inicio)",
    tags:["Obtener datos","SQL Server","OneLake","Excel","Dataverse","Conectores","ETL"],
    desc:`El <b>Grupo Datos</b> de la pestaña Inicio concentra todos los puntos de entrada para cargar datos al modelo semántico. Power BI Desktop ofrece más de <b>150 conectores nativos</b> organizados por categoría.<br><br>
Los botones visibles en la cinta corresponden a los conectores más usados:
<ul>
  <li><b>Obtener datos:</b> Abre el catálogo completo de conectores (bases de datos, archivos, servicios en línea, OData, ODBC, conector web, etc.).</li>
  <li><b>Libro de Excel:</b> Importa hojas y tablas de archivos <code>.xlsx</code> / <code>.xls</code> directamente.</li>
  <li><b>Catálogo OneLake:</b> Conecta a elementos de Microsoft Fabric (Lakehouses, almacenes de datos, conjuntos de datos semánticos).</li>
  <li><b>SQL Server:</b> Conexión directa a bases de datos SQL Server; admite consulta nativa en T-SQL, Import o DirectQuery.</li>
  <li><b>Introducir datos:</b> Abre un editor de tabla manual para datos pequeños o de referencia que no provienen de una fuente externa.</li>
  <li><b>Dataverse:</b> Accede a entidades de Microsoft Power Platform / Dynamics 365.</li>
  <li><b>Orígenes recientes:</b> Historial de fuentes usadas recientemente para reconectarse rápidamente.</li>
</ul>`,
    uso:`<dl class="kv">
  <dt>Import vs DirectQuery</dt><dd><em>Import</em> carga una copia en memoria (VertiPaq), más rápida para análisis. <em>DirectQuery</em> envía consultas en tiempo real a la fuente; no consume memoria pero depende de la latencia del origen.</dd>
  <dt>Consulta nativa SQL</dt><dd>En el conector SQL Server, expande <em>Opciones avanzadas</em> e introduce un <code>SELECT</code> o llamada a vista directamente, sin importar tablas completas.</dd>
  <dt>Parámetros de conexión</dt><dd>En Inicio → Transformar datos → Administrar parámetros puedes parametrizar el servidor o la base de datos para cambiar entornos (dev/prod) sin reescribir las consultas.</dd>
  <dt>Credenciales</dt><dd>Inicio → Transformar datos → Configuración del origen de datos administra y actualiza credenciales guardadas por conector.</dd>
</dl>`,
    tip:"Al importar desde SQL Server con vistas que contienen <code>LEFT JOIN</code> complejos, usa <b>consulta nativa</b> en lugar de seleccionar la vista en el navegador: Power Query la envía tal cual al servidor y evita que el motor M genere SQL ineficiente."
  },
  6:{
    title:"Grupo Consultas – Power Query",
    sub:"Transformar datos y Actualizar (Pestaña Inicio)",
    tags:["Power Query","Transformar","ETL","M Language","Actualizar","Query Folding"],
    desc:`El <b>Grupo Consultas</b> contiene las dos acciones clave del ciclo de datos: transformar y refrescar.<br><br>
<b>Transformar datos</b> abre el <b>Power Query Editor</b>, el motor ETL integrado de Power BI. Power Query aplica un conjunto de <em>pasos aplicados</em> escritos en el lenguaje <b>M</b> (funcional, sensible a mayúsculas). Cada paso es una transformación reproducible y auditada:
<ul>
  <li>Cambiar tipos, renombrar columnas, filtrar filas, reemplazar valores.</li>
  <li>Combinar consultas (Merge = JOIN, Append = UNION).</li>
  <li>Pivotar/despivotar columnas para normalizar estructuras.</li>
  <li>Columnas condicionales, personalizadas o desde ejemplos (IA).</li>
  <li>Agrupar (Group By) y agregar antes de cargar al modelo.</li>
  <li>Extracción de partes de fecha, texto y JSON/XML.</li>
</ul>
<b>Actualizar</b> ejecuta todas las consultas contra sus fuentes originales y recarga el modelo con los datos más recientes, respetando todos los pasos de transformación definidos.`,
    uso:`<dl class="kv">
  <dt>Query Folding</dt><dd>Power Query intenta traducir los pasos M en SQL nativo que se ejecuta en el servidor de origen (menos datos transferidos). Clic derecho sobre un paso → <em>Ver consulta nativa</em> para confirmar si el folding está activo.</dd>
  <dt>Deshabilitar carga</dt><dd>Clic derecho sobre una consulta en el panel izquierdo → desmarcar <em>Habilitar carga</em>: la consulta existe como referencia intermedia pero no ocupa espacio en el modelo final.</dd>
  <dt>Grupos de consultas</dt><dd>Organiza las consultas en carpetas dentro del panel izquierdo para separar tablas de hechos, dimensiones, parámetros y consultas auxiliares.</dd>
  <dt>Actualización selectiva</dt><dd>Clic derecho sobre una tabla en el panel Datos → <em>Actualizar ahora</em> para refrescar solo esa tabla sin recargar todo el modelo.</dd>
      <dt>Diagnóstico</dt><dd>Herramientas → Diagnóstico de consultas graba el plan de ejecución de M para detectar pasos lentos o sin query folding.</dd>
</dl>`,
    tip:"El atajo <code>Ctrl + Alt + F5</code> actualiza todos los datasets del informe desde la Vista de Informe. Programa la actualización automática publicando el <code>.pbix</code> en Power BI Service con una <b>pasarela de datos</b> (On-premises Data Gateway) si las fuentes son locales."
  },
  7:{
    title:"Panel de Filtros",
    sub:"Panel lateral de filtrado por página o informe",
    tags:["Filtros","Page Filters","Report Filters","Visual Filters","Drill-through","Seguridad"],
    desc:`El <b>Panel de Filtros</b> es el primero de los tres paneles laterales derechos y gestiona todas las condiciones de filtrado del informe mediante tres niveles de alcance independientes:<br><br>
<ul>
  <li><b>Filtros de este visual:</b> Solo afectan al objeto visual actualmente seleccionado. Son invisibles para el usuario final en el modo lectura.</li>
  <li><b>Filtros de esta página:</b> Se aplican a todos los visuales de la página activa. El usuario puede verlos e interactuar con ellos en modo lectura (si están configurados como editables).</li>
  <li><b>Filtros de todas las páginas:</b> Condición global que afecta a cada página del informe. Ideal para filtros de seguridad o de rango de fechas corporativos.</li>
</ul>
Cada filtro puede configurarse como: <em>Lista básica, Lista desplegable, Búsqueda de texto, Valor superior N, Filtro avanzado</em> (con operadores como contiene, mayor que, entre…) o <em>Fecha relativa</em>.`,
    uso:`<dl class="kv">
  <dt>Bloquear filtro</dt><dd>Haz clic en el ícono de candado (🔒) junto a un filtro para que el usuario de solo lectura no pueda modificarlo ni eliminarlo; visible pero inmutable.</dd>
  <dt>Ocultar filtro</dt><dd>Haz clic en el ícono de ojo (👁) para que el filtro sea invisible en modo lectura pero siga aplicándose: útil para filtros de seguridad internos.</dd>
  <dt>Buscar campo</dt><dd>El cuadro de búsqueda en la parte superior filtra los campos por nombre, útil cuando el modelo tiene docenas de tablas.</dd>
  <dt>Drill-through</dt><dd>En el nivel de página, la sección <em>Obtener detalles</em> permite configurar campos como claves de drill-through para que el usuario navegue de una página resumen a una página de detalle con contexto preservado.</dd>
      <dt>Limpiar todo</dt><dd>El ícono de borrador junto a cada sección elimina todos los filtros de ese nivel con un solo clic.</dd>
</dl>`,
    tip:"Para que el Panel de Filtros no aparezca en el informe publicado, ve a <b>Archivo → Opciones → Configuración del informe</b> y desactiva <em>'Los lectores pueden ver el panel de filtros'</em>. Esto no elimina los filtros, solo oculta el panel en Power BI Service."
  },

    uso:`<dl class="kv">
  <dt>Cambiar tipo</dt><dd>Con un visual seleccionado en el lienzo, haz clic en otro ícono de la galería; Power BI reasigna los campos automáticamente manteniendo los datos.</dd>
  <dt>Pestaña Formato (🖌)</dt><dd>Alterna entre <em>Compilar visual</em> y <em>Dar formato al visual</em> para acceder a cientos de opciones: colores, fuentes, bordes, leyenda, ejes, etiquetas de datos, fondo, borde y sombra.</dd>

  <dt>AppSource</dt><dd>El botón <b>'...'</b> al final de la galería abre la tienda de visuales certificados: Gantt, Bullet Chart, Radar, Sankey, Word Cloud, Box Plot y más de 300 visuales adicionales.</dd>
      <dt>Importar visual</dt><dd>Desde <em>...</em> → <em>Importar un objeto visual desde un archivo</em> puedes cargar un <code>.pbiviz</code> descargado manualmente sin acceso a Internet.</dd>

    tip:"Para mantener la coherencia visual en un informe, configura los colores en <b>Ver → Temas</b> antes de crear visuales. Los temas se aplican globalmente y se pueden exportar como JSON para reutilizarlos en otros informes."

    desc:`El <b>Panel de Datos</b> (el más a la derecha de los tres paneles) es el explorador del modelo semántico cargado en el informe. Lista todas las tablas disponibles con sus columnas y medidas DAX, organizadas en árbol expandible.<br><br>

    uso:`<dl class="kv">

  <dt>Nueva medida</dt><dd>Clic derecho sobre una tabla → <em>Nueva medida</em> para abrir la barra de fórmulas DAX y crear una medida que vive en esa tabla (pero se puede usar en cualquier visual).</dd>
      <dt>Tabla de fechas</dt><dd>Clic derecho sobre la tabla de calendario → <em>Marcar como tabla de fechas</em> → seleccionar la columna de fecha única; esto activa las funciones DAX de inteligencia de tiempo como <code>TOTALYTD</code>, <code>SAMEPERIODLASTYEAR</code> y <code>DATEADD</code>.</dd>

    tip:"Usa <b>carpetas de presentación</b> para organizar las medidas DAX en grupos lógicos dentro de una tabla: selecciona la medida en el panel → en Propiedades escribe el nombre de la carpeta en <em>Carpeta para mostrar</em>. Los campos relacionados quedarán agrupados bajo una carpeta expandible."

const SPOTS = [
  {id:1,l:52.675,t:26.209},
  {id:2,l:11.175,t:23.840},
  {id:3,l:11.025,t:33.218},
  {id:4,l:11.025,t:44.571},
  {id:5,l:17.325,t:29.763},
  {id:6,l:40.625,t:29.763},
  {id:7,l:65.675,t:58.687},
  {id:8,l:54.675,t:64.511},
  {id:9,l:54.475,t:73.396},
  {id:10,l:30.725,t:74.975}
];

const wrap = document.getElementById('wrap');
SPOTS.forEach(s=>{
  const d=document.createElement('div');
  d.className='hotspot'; d.id='h'+s.id;
  d.style.left=s.l+'%'; d.style.top=s.t+'%';
  d.setAttribute('aria-label','Componente '+s.id);
  d.onclick=()=>open_(s.id);
  wrap.appendChild(d);
});

let cur=null;
function open_(id){
  if(cur) document.getElementById('h'+cur)?.classList.remove('active');
  cur=id;
  document.getElementById('h'+id)?.classList.add('active');
  const d=DATA[id];
  document.getElementById('pnum').textContent=id;
  document.getElementById('ptitle').textContent=d.title;
  document.getElementById('psub').textContent=d.sub;
  const tags=d.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('pbody').innerHTML=`
    <div class="tags">${tags}</div>
    <div class="card">
      <h3><span class="icon-c">ℹ</span>&nbsp;Descripción</h3>
      ${d.desc.includes('<ul>') || d.desc.includes('<dl>') ? d.desc : `<p>${d.desc}</p>`}
    </div>
    <div class="card">
      <h3><span class="icon-c">⚡</span>&nbsp;Uso y configuración</h3>
      ${d.uso}
    </div>
    <div class="tip">
      <strong>💡 Consejo práctico</strong>
      <p>${d.tip}</p>
    </div>
  `;
  document.getElementById('pbody').scrollTop=0;
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('active');
}

function close_(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
  if(cur){document.getElementById('h'+cur)?.classList.remove('active'); cur=null;}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_();});
</script>
