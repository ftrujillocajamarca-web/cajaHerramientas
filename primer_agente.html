<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        :root {
            --copilot-blue: #005a9e; /* Azul más oscuro para mejor contraste */
            --copilot-hover-blue: #004b87;
            --copilot-light-blue: #eff6fc;
            --bg-light: #f3f2f1;
            --border-color: #797775; /* Bordes más oscuros */
            --text-main: #201f1e; /* Texto principal casi negro */
            --text-secondary: #494847; /* Texto secundario más oscuro para contraste */
            --sidebar-width: 220px;
            --topbar-height: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #faf9f8;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header.training-header {
            background-color: #111111;
            color: #ffffff;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            border-bottom: 3px solid var(--copilot-blue);
            z-index: 100;
        }

        .training-title h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .training-title p {
            font-size: 12px;
            color: #f3f2f1;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 300px;
        }

        .progress-bar-bg {
            background-color: #3b3a39;
            height: 8px;
            border-radius: 4px;
            flex-grow: 1;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: #00b7c3; /* Color brillante para la barra de progreso */
            height: 100%;
            width: 10%;
            transition: width 0.3s ease;
        }

        .slide-counter {
            font-size: 13px;
            font-weight: 700;
            min-width: 60px;
            text-align: right;
        }

        main.workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px - 60px);
            overflow: hidden;
        }

        section.instruction-panel {
            width: 400px;
            background-color: #ffffff;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            z-index: 50;
        }

        .instruction-content {
            padding: 24px;
        }

        .step-badge {
            display: inline-block;
            background-color: var(--text-main);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .action-title {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .section-block {
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--border-color);
        }

        .section-block:last-child {
            border-bottom: none;
        }

        .block-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .block-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .ui-location {
            background-color: #f3f2f1;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #bc101d; /* Rojo oscuro para contraste alto */
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        .tip-box {
            background-color: #fff8e5;
            border-left: 4px solid #b77c00; /* Amarillo oscuro / marrón para contraste */
            padding: 10px;
            border-radius: 0 4px 4px 0;
            font-weight: 500;
        }

        .success-box {
            background-color: #f4fbf5;
            border-left: 4px solid #107c41;
            padding: 10px;
            border-radius: 0 4px 4px 0;
            font-weight: 500;
        }

        section.interface-simulator {
            flex: 1;
            background-color: var(--bg-light);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .mockup-container {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .studio-topbar {
            height: var(--topbar-height);
            background-color: #ffffff;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .studio-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
        }

        .studio-env-selector {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border: 2px solid var(--text-main);
            border-radius: 4px;
            font-size: 12px;
            background-color: #ffffff;
            font-weight: 700;
        }

        .studio-layout {
            display: flex;
            flex: 1;
            height: calc(100% - var(--topbar-height));
            overflow: hidden;
        }

        .studio-sidebar {
            width: var(--sidebar-width);
            background-color: #f3f2f1;
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding-top: 12px;
            justify-content: space-between;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
        }

        .sidebar-menu-item.active {
            background-color: #eaeaea;
            color: var(--copilot-blue);
            font-weight: 700;
            border-left: 4px solid var(--copilot-blue);
            padding-left: 12px;
        }

        .studio-content {
            flex: 1;
            background-color: #ffffff;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }

        .studio-btn-primary {
            background-color: var(--copilot-blue);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .studio-btn-secondary {
            background-color: #ffffff;
            color: var(--text-main);
            border: 2px solid var(--text-main);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 4px;
        }

        .studio-card {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 18px;
            background: #ffffff;
        }

        .canvas-container {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            width: 100%;
        }

        .canvas-node {
            background: #ffffff;
            border: 2px solid #323130;
            border-radius: 4px;
            width: 260px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            position: relative;
        }

        .canvas-node::after {
            content: "↓";
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            color: #323130;
            font-weight: bold;
            font-size: 16px;
        }

        .canvas-node.last-node::after {
            display: none;
        }

        .node-header {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            border-radius: 2px 2px 0 0;
            text-transform: uppercase;
        }

        .node-header.trigger { background-color: #5c2d91; }
        .node-header.message { background-color: #005a9e; }
        .node-header.question { background-color: #002050; }

        .node-body {
            padding: 12px;
            font-size: 12px;
            color: #000000;
            font-weight: 500;
        }

        .click-target {
            outline: 3px dashed #d13438 !important; /* Rojo de alto contraste */
            outline-offset: 4px;
            background-color: rgba(209, 52, 56, 0.1) !important;
        }

        footer.navigation-footer {
            height: 60px;
            background-color: #ffffff;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-btn {
            background-color: #ffffff;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: var(--bg-light);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn.primary-action {
            background-color: var(--copilot-blue);
            color: white;
            border: none;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            color: #000000;
        }
        .badge-status {
            background-color: #107c41;
            color: #ffffff;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 4px;
        }
    </style>
</head>

        function renderSlide(stepIndex) {
            const data = stepsData[stepIndex];
            
            const instructionHTML = `
                <div class="instruction-content">
                    <span class="step-badge">Paso ${stepIndex} de ${totalSteps}</span>
                    <h2 class="action-title">${data.title}</h2>
                    
                    <div class="section-block">
                        <div class="block-label">🎯 Objetivo del Paso</div>
                        <div class="block-text">${data.goal}</div>
                    </div>
                    
                    <div class="section-block">
                        <div class="block-label">📍 Ubicación en Pantalla</div>
                        <div class="block-text ui-location">${data.location}</div>
                    </div>
                    
                    <div class="section-block">
                        <div class="block-label">🖱️ ¿Qué debe hacer?</div>
                        <div class="block-text"><strong>${data.desc}</strong></div>
                    </div>
                    
                    <div class="section-block">
                        <div class="block-label">👁️ Descripción Visual</div>
                        <div class="block-text">${data.visual}</div>
                    </div>
                    
                    <div class="section-block">
                        <div class="block-label">💡 Consejo de Control</div>
                        <div class="block-text tip-box">${data.tip}</div>
                    </div>
                    
                    <div class="section-block">
                        <div class="block-label">✅ Indicador de Éxito</div>
                        <div class="block-text success-box">${data.success}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('instructionPanel').innerHTML = instructionHTML;
            document.getElementById('simulatorPanel').innerHTML = `<div class="mockup-container">${data.mockup}</div>`;

            document.getElementById('slideCounter').innerText = `Paso ${stepIndex} / ${totalSteps}`;
            document.getElementById('progressBar').style.width = `${(stepIndex / totalSteps) * 100}%`;

            document.getElementById('btnPrev').disabled = (stepIndex === 1);
            
            const nextBtn = document.getElementById('btnNext');
            if (stepIndex === totalSteps) {
                nextBtn.innerText = "¡Finalizado!";
                nextBtn.style.backgroundColor = '#107c41';
                nextBtn.disabled = true;
            } else {
                nextBtn.innerText = "Siguiente →";
                nextBtn.style.backgroundColor = '';
                nextBtn.disabled = false;
            }
        }

        function changeSlide(direction) {
            const targetStep = currentStep + direction;
            if (targetStep >= 1 && targetStep <= totalSteps) {
                currentStep = targetStep;
                renderSlide(currentStep);
            }
        }

        window.onload = function() {
            renderSlide(1);
        };
    </script>
