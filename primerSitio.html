<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Asistente Avanzado de Configuración | SharePoint Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sp-primary: #0078d4;       /* Azul SharePoint */
            --sp-primary-hover: #005a9e; /* Azul Oscuro de enfoque */
            --sp-bg-light: #f3f2f1;      /* Gris Claro de Fondo */
            --sp-text-main: #323130;     /* Texto Principal M365 */
            --sp-text-muted: #605e5c;    /* Texto Secundario */
            --sp-success: #107c41;       /* Verde de éxito / validación */
            --sp-warning: #a80000;       /* Rojo de alerta / restricción */
            --card-shadow: 0 20px 40px -15px rgba(0, 120, 212, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--sp-bg-light);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* Contenedor Principal */
        .wizard-carousel {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid #edebe9;
        }

        /* Cabecera */
        .wizard-header {
            background: #ffffff;
            padding: 1.5rem 2.5rem;
            border-bottom: 1px solid #edebe9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-area .fa-microsoft {
            font-size: 1.6rem;
            color: var(--sp-primary);
        }
        
        .logo-area span {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--sp-text-main);
        }
        
        .step-counter {
            background: #eff6fc;
            color: var(--sp-primary);
            padding: 0.5rem 1.4rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #deecf9;
        }

        /* Área del Carrusel */
        .carousel-container {
            position: relative;
            overflow: hidden;
        }
        
        .slides-wrapper {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        
        .slide {
            flex: 0 0 100%;
            padding: 3rem;
            background: #ffffff;
        }

        .slide-content {
            display: flex;
            flex-wrap: wrap;
            gap: 4rem;
            align-items: flex-start;
            justify-content: center;
        }

        /* Área Visual Maquetas (Izquierda) */
        .visual-area {
            flex: 1;
            min-width: 320px;
            background: #faf9f8;
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid #f3f2f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 340px;
        }
        
        .wizard-mockup {
            width: 100%;
            background: #ffffff;
            border-radius: 8px;
            padding: 1.2rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #edebe9;
            font-size: 0.85rem;
        }

        /* Área Informativa (Derecha) */
        .text-area {
            flex: 1.3;
            min-width: 340px;
        }
        
        .text-area .step-badge {
            background: #f3f2f1;
            color: var(--sp-text-muted);
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #edebe9;
        }
        
        .text-area h2 {
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--sp-text-main);
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }
        
        .text-area p {
            color: var(--sp-text-muted);
            line-height: 1.6;
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }
        
        /* Listado Técnico */
        .feature-list {
            list-style: none;
        }
        
        .feature-list li {
            margin-bottom: 0.9rem;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            color: var(--sp-text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .feature-list li i {
            color: var(--sp-primary);
            margin-top: 4px;
            font-size: 1rem;
        }

        /* Navegación y Controles */
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            background: #faf9f8;
            border-top: 1px solid #edebe9;
        }
        
        .nav-buttons {
            display: flex;
            gap: 0.75rem;
        }
        
        .nav-btn {
            background: #ffffff;
            border: 1px solid #d2d0ce;
            font-size: 0.95rem;
            padding: 0.65rem 1.5rem;
            border-radius: 2px; /* Esquinas semicuadradas estilo Fluent UI */
            cursor: pointer;
            font-weight: 600;
            color: var(--sp-text-main);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        
        .nav-btn:hover:not(:disabled) {
            background: #f3f2f1;
            border-color: #a19f9d;
        }
        
        .nav-btn-primary {
            background: var(--sp-primary);
            color: white;
            border: 1px solid transparent;
        }
        
        .nav-btn-primary:hover:not(:disabled) {
            background: var(--sp-primary-hover);
        }
        
        .dots {
            display: flex;
            gap: 0.5rem;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: #c8c6c4;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .dot.active {
            background: var(--sp-primary);
            transform: scale(1.3);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        footer {
            background: #ffffff;
            text-align: center;
            padding: 1.2rem;
            font-size: 0.8rem;
            color: var(--sp-text-muted);
            border-top: 1px solid #edebe9;
        }

        @media (max-width: 850px) {
            .slide-content {
                flex-direction: column;
                gap: 2rem;
            }
            .slide {
                padding: 1.5rem;
            }
            .text-area h2 {
                font-size: 1.7rem;
            }
            .nav-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="wizard-carousel">
    <div class="wizard-header">
        <div class="logo-area">
            <i class="fab fa-microsoft"></i>
            <span>SharePoint Architecture</span>
            <i class="fas fa-chevron-right" style="font-size: 0.8rem; color: var(--sp-text-muted)"></i>
            <span style="font-weight:400; color: var(--sp-text-muted)">Provisionamiento de Sitios</span>
        </div>
        <div class="step-counter" id="stepCounterDisplay">Paso 1 de 9</div>
    </div>

    <div class="carousel-container">
        <div class="slides-wrapper" id="slidesWrapper">
            </div>
    </div>

    <div class="carousel-controls">
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i> <span>Anterior</span></button>
            <button class="nav-btn nav-btn-primary" id="nextBtn"><span>Siguiente</span> <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="dots" id="dotsContainer"></div>
    </div>

    <footer>
        <i class="fa-solid fa-gears"></i> Despliegue Técnico Guiado según las mejores prácticas de Microsoft 365 Architecture.
    </footer>
</div>

<script>
    // Configuración Extendida con un flujo detallado de 9 fases reales
    const slidesData = [
        {
            titulo: "Punto de Entrada en Microsoft 365",
            badge: "Fase 1 · Inicialización",
            descripcion: "El ciclo de vida de un espacio colaborativo web inicia autenticándote en el portal corporativo. Desde el lanzador de aplicaciones (waffle icon), se accede al servicio raíz de SharePoint.",
            lista: [
                "Ubicación del disparador global: Botón <strong>\"+ Crear sitio\"</strong>.",
                "Requiere licencias activas que otorguen permisos de aprovisionamiento de recursos compartidos (como Microsoft 365 E3/E5 o Business Premium).",
                "El sistema precarga las directivas de creación definidas por el administrador global de IT."
            ],
            iconoGrande: "fa-solid fa-network-wired",
            stepIdx: 0
        },
        {
            titulo: "Topología del Sitio: Modelo Estructural",
            badge: "Fase 2 · Clasificación Raíz",
            descripcion: "Debes seleccionar la infraestructura lógica del sitio. Esta decisión afecta de manera irreversible los servicios que se aprovisionarán por debajo en el Tenant:",
            lista: [
                "<strong>Sitios de Equipo (Team Sites):</strong> Diseñados para colaboración operativa bidireccional. Cada sitio crea un Grupo de Microsoft 365, un buzón de Exchange, un calendario compartido y un espacio en MS Teams.",
                "<strong>Sitios de Comunicación:</strong> Diseñados para distribución unidireccional y masiva (Intranets). No generan un grupo de M365 trasero, optimizando la jerarquía de almacenamiento."
            ],
            iconoGrande: "fa-solid fa-sitemap",
            stepIdx: 1
        },
        {
            titulo: "Modelado Eficiente mediante Plantillas",
            badge: "Fase 3 · Gobernanza Estética",
            descripcion: "Microsoft expone definiciones de sitio preconfiguradas para evitar el desarrollo desde cero. Las plantillas inyectan arquitecturas de información listas para usar:",
            lista: [
                "<strong>Plantillas de Negocio:</strong> Diseños específicos para Recursos Humanos, Gestión de Proyectos, Mesa de Ayuda o Portales de Capacitación.",
                "<strong>Estructura Inyectada:</strong> Al seleccionarse, se preconfiguran Web Parts de noticias, enlaces rápidos, bibliotecas estructuradas y esquemas de color corporativos.",
                "<strong>Personalización:</strong> Los administradores pueden aplicar plantillas personalizadas cargadas previamente en la galería de la organización."
            ],
            iconoGrande: "fa-solid fa-cubes",
            stepIdx: 2
        },
        {
            titulo: "Propiedades de Identidad y Enrutamiento URL",
            badge: "Fase 4 · Parámetros del Wizard",
            descripcion: "El asistente solicita los metadatos de direccionamiento de red. El sistema realiza llamadas síncronas a la API del Tenant para validar la unicidad del recurso:",
            lista: [
                "<strong>Nombre del Sitio:</strong> El identificador único e indexable de la Intranet.",
                "<strong>Dirección del sitio (URL):</strong> Se autogenera bajo el espacio de nombres de la empresa (ej: <code>tenant.sharepoint.com/sites/NombreSitio</code>). El sistema bloquea caracteres especiales y URLs duplicadas.",
                "<strong>Descripción:</strong> Cadena de texto obligatoria para auditorías y políticas de ciclo de vida."
            ],
            iconoGrande: "fa-solid fa-i-cursor",
            stepIdx: 3
        },
        {
            titulo: "Configuración Regional e Idioma de Interfaz",
            badge: "Fase 5 · Internacionalización",
            descripcion: "Esta opción bloquea el idioma base de los recursos del sistema. Es un parámetro crítico que no se puede modificar posteriormente tras la creación del sitio:",
            lista: [
                "Establece el idioma por defecto para las columnas de sistema, flujos automatizados de aprobación y el árbol de navegación nativo.",
                "Define la zona horaria del sitio, clave para la caducidad de documentos, agendamiento de eventos internos e indexación de contenido regional."
            ],
            iconoGrande: "fa-solid fa-globe",
            stepIdx: 4
        },
        {
            titulo: "Clasificación de Datos y Niveles de Privacidad",
            badge: "Fase 6 · Seguridad de la Información",
            descripcion: "Define el nivel de visibilidad perimetral del sitio web para mitigar riesgos de fugas de información sensible:",
            lista: [
                "<strong>Privado (Recomendado para Equipos):</strong> Solo los miembros explícitamente agregados por los propietarios pueden resolver la URL y ver los archivos.",
                "<strong>Público:</strong> Cualquier usuario autenticado dentro del directorio de la organización (Azure AD) puede leer y buscar el contenido del sitio.",
                "<strong>Etiquetas de confidencialidad (Sensitivity Labels):</strong> Clasificación avanzada según políticas corporativas (ej: Confidencial, Uso Interno, Público)."
            ],
            iconoGrande: "fa-solid fa-shield-halved",
            stepIdx: 5
        },
        {
            titulo: "Gestión de Permisos y Roles de Acceso",
            badge: "Fase 7 · Matriz de Acceso",
            descripcion: "SharePoint basa su seguridad en Grupos predeterminados que rompen o heredan permisos de manera granular:",
            lista: [
                "<strong>Propietarios (Full Control):</strong> Administradores de la colección de sitios. Pueden cambiar el diseño, eliminar carpetas del sistema y alterar permisos de terceros.",
                "<strong>Miembros (Contribute/Edit):</strong> Usuarios operativos que cargan, editan, modifican y eliminan documentos o elementos de listas.",
                "<strong>Visitantes (Read Only):</strong> Lectores con restricción total de edición; ideal para audiencias pasivas en portales de noticias corporativas."
            ],
            iconoGrande: "fa-solid fa-user-gear",
            stepIdx: 6
        },
        {
            titulo: "Arquitectura de Almacenamiento Avanzada",
            badge: "Fase 8 · Almacenamiento de Datos",
            descripcion: "En la fase previa al despliegue final, el sistema establece los parámetros lógicos de bases de datos de contenido:",
            lista: [
                "Asignación automática de cuotas de almacenamiento asignadas dinámicamente según el pool global del Tenant.",
                "Habilitación de las políticas de versiones automáticas (Versioning) en la biblioteca principal, garantizando protección contra Ransomware y permitiendo restaurar hasta 500 versiones anteriores de un archivo."
            ],
            iconoGrande: "fa-solid fa-database",
            stepIdx: 7
        },
        {
            titulo: "Aprovisionamiento y Despliegue en la Nube",
            badge: "Fase 9 · Ejecución",
            descripcion: "Al presionar 'Finalizar', el motor de aprovisionamiento en la nube de Microsoft (Azure infrastructure) ejecuta los scripts de configuración global en tiempo real:",
            lista: [
                "Creación instantánea de la base de datos de contenido indexada.",
                "Sincronización en la nube con los grupos de seguridad de Microsoft Entra ID (Azure AD).",
                "Envío de notificaciones de acceso a los colaboradores y activación automática de la interfaz responsiva Fluent UI."
            ],
            iconoGrande: "fa-solid fa-cloud-arrow-up",
            stepIdx: 8
        }
    ];

    // Renderizador de maquetas lógicas
    function buildMockupImage(stepIndex) {
        const container = document.createElement('div');
        container.className = 'wizard-mockup';
        
        switch(stepIndex) {
            case 0:
                container.innerHTML = `
                    <div style="padding: 5px;">
                        <span style="background: #eff6fc; color: var(--sp-primary); padding: 6px 12px; border-radius: 2px; font-weight:600; font-size:0.8rem; border: 1px solid var(--sp-primary); display:inline-block;">
                            <i class="fa-solid fa-plus"></i> Crear sitio
                        </span>
                        <div style="margin-top:12px; font-size:0.75rem; color:var(--sp-text-muted)"><i class="fa-solid fa-user-check"></i> Licencia: Microsoft 365 Activa</div>
                    </div>`;
                break;
            case 1:
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="border: 1.5px solid var(--sp-primary); padding: 8px; background: #eff6fc; font-weight:600;">
                            <i class="fa-solid fa-users" style="color:var(--sp-primary)"></i> Sitio de equipo
                            <div style="font-size:0.7rem; font-weight:400; color:var(--sp-text-muted); margin-top:3px;">+ Grupo M365 / Teams incl.</div>
                        </div>
                        <div style="border: 1px solid #edebe9; padding: 8px; opacity: 0.6;">
                            <i class="fa-solid fa-bullhorn"></i> Sitio de comunicación
                        </div>
                    </div>`;
                break;
            case 2:
                container.innerHTML = `
                    <div style="font-size:0.75rem;">
                        <div style="font-weight:600; margin-bottom:6px; color:var(--sp-primary)">Plantillas Disponibles</div>
                        <div style="background:#f3f2f1; padding:4px 8px; margin-bottom:4px; border-left:3px solid var(--sp-success)">📈 Gestión de Proyectos</div>
                        <div style="background:#f3f2f1; padding:4px 8px; margin-bottom:4px; opacity:0.7">👥 Onboarding RRHH</div>
                        <div style="background:#f3f2f1; padding:4px 8px; opacity:0.7">📢 Comunicaciones Corporativas</div>
                    </div>`;
                break;
            case 3:
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px; font-size:0.75rem;">
                        <div><strong>Nombre del Sitio:</strong> Intranet Ventas</div>
                        <div style="background:#f3f2f1; padding:6px; border-radius:2px; font-family:monospace; color:var(--sp-primary);">
                            https://contoso.sharepoint.com/sites/intranet-ventas
                        </div>
                        <div style="color:var(--sp-success); font-weight:600;"><i class="fa-solid fa-circle-check"></i> URL Disponible en el Tenant</div>
                    </div>`;
                break;
            case 4:
                container.innerHTML = `
                    <div style="font-size:0.75rem; display:flex; flex-direction:column; gap:5px;">
                        <div><i class="fa-solid fa-language"></i> <strong>Idioma Base:</strong> Español (ES)</div>
                        <hr style="border:none; border-top:1px solid #edebe9">
                        <div><i class="fa-solid fa-clock"></i> <strong>Zona Horaria:</strong> (UTC-05:00) Bogotá, Lima</div>
                    </div>`;
                break;
            case 5:
                container.innerHTML = `
                    <div style="font-size:0.75rem;">
                        <div style="background:#a8000015; border:1px solid var(--sp-warning); padding:8px; color:var(--sp-warning); font-weight:600; margin-bottom:6px;">
                            <i class="fa-solid fa-lock"></i> Clasificación: Privado
                        </div>
                        <div style="color:var(--sp-text-muted); font-size:0.7rem;">Solo los miembros explícitamente invitados tendrán resolución DNS del sitio.</div>
                    </div>`;
                break;
            case 6:
                container.innerHTML = `
                    <div style="font-size:0.75rem; display:flex; flex-direction:column; gap:4px;">
                        <span style="color:var(--sp-primary); font-weight:600;">Grupos de Seguridad Nativos:</span>
                        <div style="background:#f3f2f1; padding:3px 6px;">👑 Propietarios (Control Total)</div>
                        <div style="background:#f3f2f1; padding:3px 6px;">👥 Miembros (Edición/Lectura)</div>
                        <div style="background:#f3f2f1; padding:3px 6px;">👀 Visitantes (Sólo Lectura)</div>
                    </div>`;
                break;
            case 7:
                container.innerHTML = `
                    <div style="font-size:0.75rem; display:flex; flex-direction:column; gap:5px;">
                        <div><i class="fa-solid fa-hard-drive"></i> <strong>Storage Pool:</strong> Dinámico</div>
                        <div style="background:#eff6fc; padding:6px; border-left:3px solid var(--sp-primary);">
                            <i class="fa-solid fa-clock-rotate-left"></i> Historial de versiones activo (500 ciclos)
                        </div>
                    </div>`;
                break;
            case 8:
                container.innerHTML = `
                    <div style="text-align:center; padding:10px;">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size:2rem; color:var(--sp-primary); animation: bounce 2s infinite;"></i>
                        <h4 style="margin-top:6px; color:var(--sp-success)"><i class="fa-solid fa-circle-check"></i> Provisionamiento Exitoso</h4>
                        <span style="font-size:0.7rem; color:var(--sp-text-muted)">Aprovisionado en Azure Cloud</span>
                    </div>`;
                break;
        }
        return container;
    }

    // Elementos del DOM
    const slidesWrapper = document.getElementById('slidesWrapper');
    const dotsContainer = document.getElementById('dotsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stepCounterSpan = document.getElementById('stepCounterDisplay');
    
    let currentIndex = 0;
    const totalSlides = slidesData.length;
    
    // Inyección Estructurada de Diapositivas
    function renderSlides() {
        slidesWrapper.innerHTML = '';
        slidesData.forEach((slide) => {
            const slideDiv = document.createElement('div');
            slideDiv.classList.add('slide');
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('slide-content');
            
            // Ilustración lateral izquierda
            const visualDiv = document.createElement('div');
            visualDiv.classList.add('visual-area');
            
            const mainIcon = document.createElement('div');
            mainIcon.style.fontSize = '2.5rem';
            mainIcon.style.color = 'var(--sp-primary)';
            mainIcon.style.marginBottom = '1.2rem';
            mainIcon.innerHTML = `<i class="${slide.iconoGrande}"></i>`;
            
            visualDiv.appendChild(mainIcon);
            visualDiv.appendChild(buildMockupImage(slide.stepIdx));
            
            // Cuerpo de texto derecho
            const textDiv = document.createElement('div');
            textDiv.classList.add('text-area');
            
            textDiv.innerHTML = `
                <div class="step-badge">${slide.badge}</div>
                <h2>${slide.titulo}</h2>
                <p>${slide.descripcion}</p>
            `;
            
            const ul = document.createElement('ul');
            ul.className = 'feature-list';
            slide.lista.forEach(item => {
                ul.innerHTML += `<li><i class="fa-solid fa-square-caret-right"></i><div>${item}</div></li>`;
            });
            textDiv.appendChild(ul);
            
            contentDiv.appendChild(visualDiv);
            contentDiv.appendChild(textDiv);
            slideDiv.appendChild(contentDiv);
            slidesWrapper.appendChild(slideDiv);
        });
        
        updateCarousel();
        createDots();
    }
    
    function updateCarousel() {
        slidesWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
        stepCounterSpan.innerText = `Paso ${currentIndex + 1} de ${totalSlides}`;
        
        prevBtn.disabled = (currentIndex === 0);
        
        if (currentIndex === totalSlides - 1) {
            nextBtn.innerHTML = `<span>Finalizar</span> <i class="fas fa-check-circle"></i>`;
        } else {
            nextBtn.innerHTML = `<span>Siguiente</span> <i class="fas fa-chevron-right"></i>`;
        }

        document.querySelectorAll('.dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIndex);
        });
    }
    
    function createDots() {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === currentIndex) dot.classList.add('active');
            dot.addEventListener('click', () => {
                currentIndex = i;
                updateCarousel();
            });
            dotsContainer.appendChild(dot);
        }
    }
    
    // Controladores de eventos de Botón
    nextBtn.addEventListener('click', () => {
        if (currentIndex < totalSlides - 1) {
            currentIndex++;
            updateCarousel();
        } else {
            alert("🚀 Despliegue de arquitectura completado. El sitio se encuentra federado en la raíz del Tenant de Microsoft 365.");
        }
    });
    
    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            updateCarousel();
        }
    });
    
    window.addEventListener('resize', () => updateCarousel());

    // Arranque
    renderSlides();
</script>
</body>
</html>
